name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.1.0
      - run: unzip -q GlassLock2_Pass11_Optical_Liquid_Glass.zip
      - run: gradle assembleDebug --stacktrace
        working-directory: GlassLock2
      - uses: actions/upload-artifact@v4
        with:
          name: glasslock-debug-apk
          path: GlassLock2/app/build/outputs/apk/debug/*.apk
